<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset=""UTF-8">
    <meta name=""viewport" content=""width=device-width, initial-scale="1">
    <title>Carbon Receipt - the bill your day runs up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="inputs">
            <h1>Carbon Receipt</h1>
            <p>Tell us about your day. We print the carbon bill</p>
            <div id="fields"></div>
        </section>

        <section class="receipt" aria-live="polite">
            <h2>YOUR DAY</h2>
            <p class="date" id="date"></p>
            <ul id="lines"></ul>
            <p class="total"><span>TOTAL</span><span id="total">0.0 kg CO₂</span></p>
            <p id="extra"></p>
            <p id="tip" class="tip"></p>
            <p class="fine">Estimates for India using rough average factors. Good for awareness, not for audits.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
